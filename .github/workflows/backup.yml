# Daily Cloudflare D1 backup.
#
# Dumps every user table via the D1 REST API, encrypts the dump with AES-256-GCM,
# and uploads the ciphertext as a GitHub Actions artifact (90-day retention).
# Dumps are never committed.
#
# PUBLIC REPO WARNING: On a public repository, workflow artifacts are readable
# by anyone signed into GitHub (and the REST artifacts endpoint serves them
# without authentication). Artifacts are NOT private. That is why the dump is
# encrypted before upload — a plaintext dump would publish users.email and
# users.password_hash to the world.
#
# Required repo secrets:
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_API_TOKEN      (D1:Read)
#   CLOUDFLARE_D1_DATABASE_ID
#   BACKUP_ENCRYPTION_KEY    64 hex chars (32 bytes). Generate once:
#     node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#     Store in GitHub repo secrets AND somewhere the owner can retrieve it.
#     Losing this key makes every dump permanently unrecoverable.
#     Missing/malformed key fails the job — never falls back to plaintext.
#
# Restore:
#   BACKUP_ENCRYPTION_KEY=<key> node .github/scripts/restore-d1.mjs dump.json.enc out.json
#
# Fail-closed: the script exits non-zero on API errors, missing encryption key,
# empty/under-threshold export, or per-table sanity failures. upload-artifact
# fails if no .json.enc file was produced.

name: D1 daily backup

on:
  schedule:
    # Daily at 06:17 UTC. Explicit fixed minute; not "whenever".
    - cron: '17 6 * * *'
  workflow_dispatch:

# Artifacts only — no git write, no PR comments.
permissions:
  contents: read
  actions: write

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export D1 and upload encrypted artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Export and encrypt D1 dump
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_OUT_DIR: backup-out
          # Total-row floor: not trivially satisfiable by a 1-row partial export.
          # Override via repo variable if the live DB shrinks intentionally.
          BACKUP_MIN_ROWS: '100'
        run: node .github/scripts/backup-d1.mjs

      - name: Upload encrypted dump as artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup-out/*.json.enc
          retention-days: 90
          if-no-files-found: error
